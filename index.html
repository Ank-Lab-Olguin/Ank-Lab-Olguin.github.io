<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ank Lab — Photo Editing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ════════════════════════════════════════
       NAVBAR
  ════════════════════════════════════════ -->
  <nav class="navbar">
    <div class="nav-logo">
      <img src="./public/PAGINA WEB/LOGOS/sticker_Portfolio.png" alt="Ank Lab" data-ph="navLogoPH" />
    </div>
    <ul class="nav-links">
      <li><a href="#about">About Me</a></li>
      <li><a href="#Photos">Photography</a></li>
      <li><a href="#social">Social Media</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>


  <!-- ════════════════════════════════════════
       HERO — id="about"
  ════════════════════════════════════════ -->
  <section class="hero" >
    <video autoplay muted loop playsinline webkit-playsinline preload="auto" >
      <source src="public/PAGINA WEB/VIDEOS/Payasas_Fondo.mp4" type="video/mp4"  />
    </video>
    <div class="hero-overlay"></div>
        <!-- ── TÍTULO ABOUT ME ── -->
    <div class="hero-about-title deco">
      <span>About</span>
      <span>ME</span>
    </div>
    <img src="./public/PAGINA WEB/VIDEOS/Elementos/Estrella_IZQ.gif" alt="" class="deco star-left" />
    <img src="./public/PAGINA WEB/VIDEOS/Elementos/Estrella_DER.gif" alt="" class="deco star-right" />
    <img src="./public/PAGINA WEB/Elementos/ank olguin.png" alt="aboutMe" class="deco hero-note" id="about"/>
    <div class="deco hero-polaroid-wrap">
      <img src="./public/PAGINA WEB/VIDEOS/Elementos/Polaroid_Video.gif" alt="polaroid" class="polaroid-img" />
      <img src="./public/PAGINA WEB/Elementos/Diseño sin título/detalle.png" alt="detalles" class="polaroid-detail" />
    </div>
  </section>


  <!-- ════════════════════════════════════════
       SECTION HEADER — Photography
  ════════════════════════════════════════ -->
  <div class="section-header" id="Photos">
    <div class="section-title-wrap">
      <video autoplay muted loop playsinline webkit-playsinline class="section-wings">
        <source src="./public/PAGINA WEB/VIDEOS/Alas web_2.mp4" type="video/mp4" />
      </video>
      <img src="./public/PAGINA WEB/Elementos/textoAlas.png" alt="Photography" style="height: 20vw; width: 20vw; margin-top: 2vw;" />
    </div>
    <div class="section-logo">
      <img src="./public/PAGINA WEB/LOGOS/Portafolio_Moodboard.png" alt="Ank Lab" />
    </div>
  </div>


    <!-- Fondo textura gris — cambia src="" -->
    <img src="./public/PAGINA WEB/Elementos/machete collab.png" alt="" class="collab-bg" />



  </section>


  <!-- ════════════════════════════════════════
       SOCIAL MEDIA — id="social"
       Fondo papel → imagen
       Post Instagram, celular, estrellas → imágenes
       Título y "Formato" → texto editable
  ════════════════════════════════════════ -->
<section class="social" id="social">
  <img src="./public/PAGINA WEB/VIDEOS/Yeipank.png" alt="" class="social-bg" />
  <img src="./public/PAGINA WEB/VIDEOS/Telefono.gif" alt="Teléfono" class="social-phone" />
</section>


  <!-- ════════════════════════════════════════
       CONTACT — id="contact"
       Dientes, símbolos y dibujo → imágenes
       Título e IDs de cuentas → texto editable
  ════════════════════════════════════════ -->
  <section class="contact" id="contact">

    <!-- Fondo dientes — cambia src="" -->
    <img src="./public/PAGINA WEB/Elementos/Contact.png" alt="" class="contact-bg" />


  </section>


  <!-- ════════════════════════════════════════
       FOOTER
  ════════════════════════════════════════ -->
  <footer>
    <span>Ank Lab</span> &nbsp;·&nbsp; Freelance &nbsp;·&nbsp; Querétaro, México
  </footer>

  <script src="main.js"></script>
</body>
</html>
